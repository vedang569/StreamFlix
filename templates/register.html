{% extends "base.html" %}
{% block title %}Create Account — StreamFlix{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <span class="slate auth-slate">Admit One</span>
        <span class="auth-logo">StreamFlix</span>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Join StreamFlix and start streaming today.</p>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required
                       placeholder="John Doe" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required
                       placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••" minlength="6" autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary" id="btn-register">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account?<a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
