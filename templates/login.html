{% extends "base.html" %}
{% block title %}Sign In — StreamFlix{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <span class="slate auth-slate">Admit One</span>
        <span class="auth-logo">StreamFlix</span>
        <h1>Sign In</h1>
        <p class="auth-subtitle">Welcome back. Enter your credentials to continue.</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required
                       placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" id="btn-login">Sign In</button>
        </form>

        <p class="auth-footer">
            New to StreamFlix?<a href="{{ url_for('register') }}">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
